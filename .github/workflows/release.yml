name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          FILE_VERSION="$(cat VERSION)"
          # pre-release tags (vX.Y.Z-foo) may match either X.Y.Z-foo or X.Y.Z
          if [ "$TAG_VERSION" != "$FILE_VERSION" ] && [ "$BASE_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file (${FILE_VERSION})"
            exit 1
          fi

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vendor
        run: go mod vendor

      - name: Build
        run: make build

      - name: Create source tarball
        run: |
          make dist
          mv systemd-mcp.tar.gz "systemd-mcp-${GITHUB_REF_NAME#v}.tar.gz"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE \
            bin/systemd-mcp \
            bin/gatekeeper \
            "systemd-mcp-${GITHUB_REF_NAME#v}.tar.gz"
